<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checking your browser...</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f3f3f3;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .cloudflare-container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            max-width: 400px;
        }

        .cloudflare-logo {
            width: 150px;
            margin-bottom: 10px;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
    <script>
        function setSession() {
            sessionStorage.setItem("lastVerification", Date.now()); // Store session timestamp
        }

        function needsVerification() {
            let lastCheck = sessionStorage.getItem("lastVerification");
            if (!lastCheck) return true; // If no session, force verification
            let elapsed = Date.now() - parseInt(lastCheck);
            return elapsed >= 10000; // 10 seconds session timeout
        }

        function verifyAndRedirect() {
            setSession(); // Reset session
            setTimeout(() => {
                window.location.href = "index.html"; // Redirect after 10 seconds
            }, 10000);
        }

        if (needsVerification()) {
            window.onload = verifyAndRedirect;
        } else {
            window.location.href = "index.html"; // Skip verification if session is active
        }
    </script>
</head>
<body>
    <div class="cloudflare-container">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/4b/Cloudflare_Logo.svg/1200px-Cloudflare_Logo.svg.png" alt="Cloudflare Logo" class="cloudflare-logo">
        <h2>Checking your browser before accessing this site...</h2>
        <p>This process is automatic. Your browser will redirect shortly.</p>
        <div class="loading-spinner"></div>
        <p>If you are not redirected, <a href="index.html">click here</a>.</p>
    </div>
</body>
</html>
