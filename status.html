<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #0d1117;
            color: #fff;
            text-align: center;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        h1 {
            font-size: 6rem;
            font-weight: 600;
            letter-spacing: 5px;
            position: relative;
            animation: glitch 1.5s infinite alternate;
        }

        p {
            font-size: 1.5rem;
            margin-top: 10px;
            opacity: 0.8;
        }

        .btn {
            margin-top: 20px;
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: bold;
            color: #fff;
            background: #007BFF;
            border: none;
            border-radius: 5px;
            text-decoration: none;
            transition: 0.3s;
        }

        .btn:hover {
            background: #ffea00;
            color: black;
        }

        @keyframes glitch {
            0% { text-shadow: 2px 2px 0px #ff005a, -2px -2px 0px #00bfff; }
            100% { text-shadow: -2px -2px 0px #ff005a, 2px 2px 0px #00bfff; }
        }
    </style>
</head>
<body>
    <h1>404</h1>
    <p>Oops! This page does not exist.</p>
    <a href="/" class="btn">Go Home</a>
</body>
</html>
