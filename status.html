<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chat UI Only</title>
  <style>
    :root {
      --primary: #10a37f;
      --bg-dark: #202123;
      --bg-light: #f7f7f8;
      --border: #e5e7eb;
      --text: #343541;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; }
    body { display: flex; height: 100vh; overflow: hidden; }
    .sidebar {
      width: 260px;
      background: var(--bg-dark);
      color: white;
      display: flex;
      flex-direction: column;
    }
    .new-chat {
      padding: 12px;
      margin: 12px;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 6px;
      cursor: pointer;
    }
    .new-chat:hover { background: rgba(255,255,255,0.1); }
    .chat-history {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }
    .chat-item {
      padding: 10px;
      margin-bottom: 5px;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .chat-item:hover { background: rgba(255,255,255,0.1); }
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: white;
    }
    .tabs {
      display: flex;
      background: var(--bg-light);
      border-bottom: 1px solid var(--border);
    }
    .tab {
      padding: 12px 16px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
    }
    .tab.active {
      border-bottom: 2px solid var(--primary);
      font-weight: bold;
    }
    .tab-content {
      flex: 1;
      overflow-y: auto;
    }
    .tab-panel {
      display: none;
      height: 100%;
    }
    .tab-panel.active {
      display: flex;
      flex-direction: column;
    }
    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }
    .message {
      display: flex;
      margin-bottom: 20px;
    }
    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 2px;
      margin-right: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }
    .user-avatar { background: #d3d3d3; }
    .content {
      flex: 1;
      line-height: 1.5;
    }
    .input-area {
      padding: 15px;
      display: flex;
      align-items: center;
      border-top: 1px solid var(--border);
    }
    .input-field {
      flex: 1;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
      height: 50px;
      resize: none;
    }
    .send-btn {
      padding: 12px 16px;
      margin-left: 10px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .docs, .settings-tab {
      padding: 20px;
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="new-chat" onclick="startNewChat()">+ New Chat</div>
    <div class="chat-history" id="chat-history"></div>
  </div>
  <div class="main">
    <div class="tabs">
      <div class="tab active" data-tab="chat" onclick="switchTab('chat')">Chat</div>
      <div class="tab" data-tab="docs" onclick="switchTab('docs')">Documentation</div>
      <div class="tab" data-tab="settings" onclick="switchTab('settings')">Settings</div>
    </div>
    <div class="tab-content">
      <div class="tab-panel active" id="chat-panel">
        <div class="chat-container" id="chat-container"></div>
        <div class="input-area">
          <textarea class="input-field" id="user-input" placeholder="Type something..."></textarea>
          <button class="send-btn" id="send-button">Send</button>
        </div>
      </div>
      <div class="tab-panel" id="docs-panel">
        <div class="docs">
          <h1>Docs</h1>
          <p>Put your documentation here.</p>
        </div>
      </div>
      <div class="tab-panel" id="settings-panel">
        <div class="settings-tab">
          <h2>Settings</h2>
          <p>Put your settings here.</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    let chats = [];
    let currentChat = 0;

    function startNewChat() {
      chats.push([]);
      currentChat = chats.length - 1;
      updateChatHistory();
      loadChat(currentChat);
    }

    function updateChatHistory() {
      const history = document.getElementById("chat-history");
      history.innerHTML = "";
      chats.forEach((chat, index) => {
        const item = document.createElement("div");
        item.classList.add("chat-item");
        item.textContent = chat[0]?.content?.slice(0, 30) + "..." || "New Chat";
        item.onclick = () => loadChat(index);
        history.appendChild(item);
      });
    }

    function loadChat(index) {
      currentChat = index;
      const container = document.getElementById("chat-container");
      container.innerHTML = "";
      chats[index].forEach(msg => displayMessage(msg.content, msg.role));
      switchTab("chat");
    }

    function displayMessage(content, role) {
      const container = document.getElementById("chat-container");
      const msg = document.createElement("div");
      msg.classList.add("message");
      const avatar = document.createElement("div");
      avatar.classList.add("avatar", role === 'user' ? "user-avatar" : "ai-avatar");
      avatar.textContent = role === 'user' ? "You" : "Bot";
      const contentDiv = document.createElement("div");
      contentDiv.classList.add("content");
      contentDiv.textContent = content;
      msg.appendChild(avatar);
      msg.appendChild(contentDiv);
      container.appendChild(msg);
      container.scrollTop = container.scrollHeight;
    }

    async function sendMessage() {
      const input = document.getElementById("user-input");
      const text = input.value.trim();
      if (!text) return;
      
      // Display user message
      chats[currentChat].push({ role: 'user', content: text });
      displayMessage(text, 'user');
      input.value = '';

      // Send message to backend AI API
      const response = await fetch(`http://69.30.219.179:1407/ai?chat=${encodeURIComponent(text)}`);
      const data = await response.json();
      
      // Display AI response
      const aiReply = data.response || "No response from AI";
      chats[currentChat].push({ role: 'assistant', content: aiReply });
      displayMessage(aiReply, 'assistant');
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
      document.getElementById(`${tab}-panel`).classList.add('active');
    }

    document.getElementById("send-button").addEventListener("click", sendMessage);

    // Start
    startNewChat();
  </script>
</body>
</html>
